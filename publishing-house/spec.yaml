project:
  slug: "ansible-on-rhel"
  owner_email: "psrivast@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "zero_touch"
  description: "Installing Ansible and ANsible Navigator on RHEL 10"
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-702"
  workflow_id: "d326aff4-cd90-46a1-b20b-f9f87e648c04"

spec:
  title: "Getting Started with Ansible on RHEL 10"
  learning_objectives:
    - "Install ansible-core and ansible-navigator from RHEL 10 AppStream repositories"
    - "Create a basic Ansible playbook and verify it runs successfully using Ansible Navigator"
  modules:
    - id: module-01
      title: "Installing Ansible and Ansible Navigator"
      duration_min: 15
      status: not_started
    - id: module-02
      title: "Running Your First Playbook"
      duration_min: 15
      status: not_started
  environment:
    platform: ""               # ocp | rhel-vms — determines which sizing fields apply
    topology: ""               # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: ""                 # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: []              # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 0.5
  audience: "beginner"       # beginner | intermediate | advanced

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: "No existing catalog item walks a beginner sysadmin through installing ansible-core and ansible-navigator from RHEL 10 AppStream and running their first playbook. Existing labs either assume Ansible is pre-installed, require an AAP subscription, or target RHEL broadly rather than RHEL 10 specifically."
    design_overview: "A 30-minute beginner lab for system administrators who need to set up Ansible on RHEL 10 for the first time. Participants install ansible-core and ansible-navigator from RHEL 10 AppStream repositories using standard dnf commands, then create and run a basic playbook using Ansible Navigator to verify the setup. No prior Ansible experience or AAP subscription is required."
    module_summaries:
      - title: "Installing Ansible and Ansible Navigator"
        overview: "Covers installing ansible-core and ansible-navigator on a clean RHEL 10 VM using AppStream repos. Participants confirm repository availability, install both tools with dnf, and verify successful installation with version checks."
      - title: "Running Your First Playbook"
        overview: "Participants create a minimal Ansible playbook, run it with ansible-navigator, and confirm the expected output. Completing this module verifies the full Ansible toolchain is functional on RHEL 10."
    rcars_overlap_pct: 65
    rcars_top_matches:
      - title: "Ansible Workshop - Ansible for Red Hat Enterprise Linux (90 mins)"
        ci_name: "zt-ansiblebu.zt-ans-bu-rhel-90.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-ansiblebu.zt-ans-bu-rhel-90.prod"
        relevance_score: 65
        why_it_fits: "This beginner-level workshop introduces Ansible on RHEL, covering playbook authoring, inventory management, and core modules — directly relevant to an audience learning Ansible fundamentals on RHEL. However, it does not specifically cover installing ansible-core or ansible-navigator from AppStream repositories."
      - title: "Getting started with Ansible Navigator"
        ci_name: "zt-ansiblebu.zt-ans-bu-ansible-nav.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-ansiblebu.zt-ans-bu-ansible-nav.prod"
        relevance_score: 62
        why_it_fits: "This beginner lab directly teaches ansible-navigator usage, TUI navigation, and running playbooks. However, it focuses on AAP 2 execution environments rather than installing ansible-core and ansible-navigator from RHEL AppStream repositories."
      - title: "RHEL 10 Base"
        ci_name: "sandboxes-gpte.rhel10-base.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=sandboxes-gpte.rhel10-base.prod"
        relevance_score: 52
        why_it_fits: "This lab runs on RHEL 10 and includes hands-on Ansible playbook execution using RHEL System Roles. However, it does not cover installing ansible-core or ansible-navigator from AppStream, and is rated intermediate rather than beginner."
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
