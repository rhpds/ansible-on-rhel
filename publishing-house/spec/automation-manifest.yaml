# Automation Manifest — DRAFT
# Generated during intake. Refined during development.

approach: ansible

infrastructure:
  type: rhel-vms        # per-student RHEL VMs provisioned via CNV
  multi_user: false
  users_per_deployment: 1

vms_per_student:
  - role: rhel10
    count: 1
    cpu: 2
    ram_gb: 8
    disk_gb: 20
    os: RHEL 10

operators: []           # no operators required — RHEL-only lab

external_services:
  - cdn.redhat.com      # AppStream package downloads

setup_tasks:
  - Provision RHEL 10 VM per student
  - Configure RHEL 10 AppStream repositories
  - Ensure no Ansible packages are pre-installed

notes: "Students install ansible-core and ansible-navigator themselves as part of the lab. No pre-installation required."
